<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MRI Brain Tumor Identifier</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      padding: 30px;
      text-align: center;
    }

    h1 { font-size: 2rem; margin-bottom: 15px; color: #333; }
    p { font-size: 1rem; margin-bottom: 20px; color: #555; }

    input[type="file"] {
      padding: 10px 15px;
      font-size: 1rem;
      border: 2px solid #4a90e2;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      background: #f0f8ff;
    }

    input[type="file"]:hover { background: #e6f0ff; }

    #previewImage {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }

    .labels {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f3f3f3;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 500;
    }

    .bar {
      height: 12px;
      border-radius: 6px;
      background: #4a90e2;
      transition: width 0.5s ease;
    }

    .label-name { font-weight: 600; margin-right: 10px; }

    canvas { display: none; }

    @media (max-width: 600px) {
      .container { padding: 20px; }
      h1 { font-size: 1.5rem; }
      p { font-size: 0.9rem; }
      .label { flex-direction: column; align-items: flex-start; }
      .label-name { margin-bottom: 4px; }
      .bar-container { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>MRI Brain Tumor Identifier</h1>
    <p>Upload an MRI image (JPG/PNG) to predict the type of brain tumor.</p>

    <input type="file" id="imageUpload" accept="image/*">
    <img id="previewImage" src="" alt="Uploaded MRI">

    <canvas id="canvas" width="480" height="480"></canvas>
    <div class="labels" id="label-container"></div>
  </div>

  <!-- Audio files -->
  <audio id="clickSound" src="sounds/mixkit-arcade-game-jump-coin-216.wav"></audio>
  <audio id="successSound" src="sounds/mixkit-fantasy-game-success-notification-270.wav"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.14.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <script>
    const MODEL_URL = 'tm-my-image-model/';
    let model, maxPredictions;

    const imageUpload = document.getElementById('imageUpload');
    const previewImage = document.getElementById('previewImage');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const labelContainer = document.getElementById('label-container');

    const clickSound = document.getElementById('clickSound');
    const successSound = document.getElementById('successSound');

    async function init() {
      const modelURL = MODEL_URL + 'model.json';
      const metadataURL = MODEL_URL + 'metadata.json';
      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      labelContainer.innerHTML = '';
      for (let i = 0; i < maxPredictions; i++) {
        const div = document.createElement('div');
        div.className = 'label';
        div.innerHTML = `
          <span class="label-name" id="label-name-${i}">...</span>
          <div class="bar-container" style="flex:1; background:#ddd; border-radius:6px; margin-left:10px; height:12px;">
            <div class="bar" id="bar-${i}" style="width:0%;"></div>
          </div>
          <span id="percent-${i}">0%</span>
        `;
        labelContainer.appendChild(div);
      }
    }

    async function predict(imageSource) {
      const prediction = await model.predict(imageSource, false);
      let highest = 0;
      let highlightIndex = 0;

      for (let i = 0; i < prediction.length; i++) {
        const p = prediction[i];
        const bar = document.getElementById(`bar-${i}`);
        const name = document.getElementById(`label-name-${i}`);
        const percent = document.getElementById(`percent-${i}`);

        const prob = (p.probability * 100).toFixed(1);
        name.innerText = p.className;
        percent.innerText = prob + '%';

        if (p.probability > 0.7) bar.style.background = '#e74c3c';    // Red
        else if (p.probability > 0.4) bar.style.background = '#f1c40f'; // Yellow
        else bar.style.background = '#2ecc71';                          // Green

        bar.style.width = '0%';
        let width = 0;
        const target = prob;
        const interval = setInterval(() => {
          if (width >= target) clearInterval(interval);
          else { width += 1; bar.style.width = width + '%'; }
        }, 10);
      }

      // Highlight highest probability
      for (let i = 0; i < prediction.length; i++) {
        document.getElementById(`bar-${i}`).style.border = i === highlightIndex ? '2px solid #000' : 'none';
        if (prediction[i].probability > highest) { highest = prediction[i].probability; highlightIndex = i; }
      }
    }

    imageUpload.addEventListener('change', (ev) => {
      clickSound.play(); // play click sound

      const file = ev.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = async () => {
        previewImage.src = img.src;

        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        await predict(canvas);
        successSound.play(); // play success sound when prediction finishes
      };
      img.src = URL.createObjectURL(file);
    });

    init().catch(err => {
      console.error(err);
      alert('Failed to load model. Make sure MODEL_URL is set correctly and files are served over HTTP(S).');
    });
  </script>
</body>
</html>
